[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajectory-fuse"
version = "0.2.2"
description = "Circuit-breaker for agent tool-call loops — detect deadlocks, semantic stagnation, and runaway cycles before they cost you a dollar."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aniket Karne", email = "aniketkarne@users.noreply.github.com"},
]
keywords = [
    "agent",
    "llm",
    "deadlock",
    "tool-call",
    "guard",
    "runtime",
    "stagnation",
    "trajectory",
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
trajectory-fuse = "trajectory_fuse.cli:main"

[project.urls]
Homepage = "https://github.com/aniketkarne/trajectory-fuse"
Repository = "https://github.com/aniketkarne/trajectory-fuse.git"
Issues = "https://github.com/aniketkarne/trajectory-fuse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_fuse"]

[tool.hatch.build.targets.wheel.shared-data]
"examples" = "trajectory_fuse/share/examples"
"benchmarks" = "trajectory_fuse/share/benchmarks"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"