# Minimal ruff config for trajectory-fuse.
#
# The codebase predates ruff; we apply the linter only to files
# authored under this audit's scope and to the source modules.

target-version = "py39"
line-length = 110

[lint]
# Conservative defaults; catch real bugs but skip the kind of
# pedantic churn that would balloon a PR into a refactor.
#
# We disable UP006/UP035/UP045 because the package targets
# Python 3.9+, and PEP 604 union syntax (``X | None``) is only
# valid from 3.10 onward. ``Optional[X]`` and ``List[X]`` are the
# portable form.
select = ["F", "S", "I"]
ignore = [
    "S110",  # try-except-pass — intentional in many places here.
    "S112",  # try-except-continue — same.
    "S101",  # assert in tests — pytest idiom.
    "UP",    # Python 3.10+ syntax — out of scope until we drop 3.9.
]

[lint.per-file-ignores]
# Pre-existing tests with stale imports / unused vars / hardcoded
# test tokens / subprocess calls — clean up opportunistically as
# you touch them, but don't fail the lint pass on the audit's
# pre-existing scope.
"tests/test_*.py" = ["F401", "F841", "S106", "S603", "F811", "I001"]
# Benchmarks are deliberately permissive.
"benchmarks/*" = ["F401", "E402", "I001"]
# Pre-existing source files with stale imports / unsorted blocks /
# sha1 usage that pre-dates the audit — covered by tests and not
# in scope for this pass.
"src/trajectory_fuse/cli.py" = ["F401", "I001"]
"src/trajectory_fuse/export.py" = ["I001"]
"src/trajectory_fuse/guard.py" = ["F401", "I001"]
"src/trajectory_fuse/loader.py" = ["F401", "F811"]
"src/trajectory_fuse/store.py" = ["I001"]
"src/trajectory_fuse/hashing.py" = ["S324"]
"src/trajectory_fuse/__init__.py" = ["I001"]
"examples/*" = ["F401"]
