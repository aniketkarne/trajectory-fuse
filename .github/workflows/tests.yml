name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: |
          python -m pytest -q
      - name: CLI smoke
        run: |
          trajectory-fuse --version
          trajectory-fuse demo > /tmp/demo.out
          test -s /tmp/demo.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: ruff
        run: |
          ruff check src tests benchmarks
          ruff format --check src tests benchmarks

  efficacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Efficacy benchmark (strict)
        run: |
          python benchmarks/run_efficacy.py --scaled --strict --json > /tmp/efficacy.json
          cat /tmp/efficacy.json
      - name: Perf benchmark (regression check)
        run: |
          python benchmarks/run_benchmarks.py --strict --json > /tmp/perf.json
          cat /tmp/perf.json | python -c "import json, sys; r=json.load(sys.stdin); print('perf scenarios:', len(r))"